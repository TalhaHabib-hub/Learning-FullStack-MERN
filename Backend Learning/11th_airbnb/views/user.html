<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airbnb | Home</title>
    <link rel="stylesheet" href="/output.css" />
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-slate-100 text-slate-800"
  >
    <header
      class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5"
    >
      <a href="/" class="text-2xl font-bold tracking-tight text-rose-500"
        >Airbnb</a
      >
      <a
        href="/host/add_home"
        class="rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:border-rose-200 hover:text-rose-600"
        >Become a host</a
      >
    </header>

    <main class="mx-auto flex max-w-6xl items-center px-6 py-12">
      <section
        class="w-full rounded-3xl bg-white p-8 shadow-xl shadow-slate-200/60 ring-1 ring-slate-200 md:p-12"
      >
        <p
          class="mb-3 text-xs font-semibold uppercase tracking-[0.28em] text-rose-500"
        >
          A place to begin
        </p>
        <h1
          class="max-w-xl text-4xl font-bold tracking-tight text-slate-900 md:text-6xl"
        >
          Make room for a better stay.
        </h1>
        <p class="mt-5 max-w-lg text-lg text-slate-600">
          Your next chapter starts with a place that feels like yours.
        </p>
        <div class="mt-8 flex flex-wrap items-center gap-4">
          <a
            href="/host/add_home"
            class="inline-flex items-center rounded-full bg-rose-500 px-6 py-3 text-base font-semibold text-white shadow-lg shadow-rose-500/30 transition hover:bg-rose-600"
            >Add your home <span aria-hidden="true" class="ml-2">+</span></a
          >
          <a
            href="/"
            class="inline-flex items-center rounded-full border border-slate-200 px-6 py-3 text-base font-semibold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50"
            >Explore stays</a
          >
        </div>
      </section>
    </main>
  </body>
</html>
